# Builds the Windows app on a real Windows machine provided by GitHub, tests it,
# and produces:  SpotifyLyricsOverlay-Setup-<version>.exe  (installer)
#                SpotifyLyricsOverlay-Portable-<version>.zip (no install needed)
# Download them from the "Actions" tab -> latest run -> "Artifacts",
# or from "Releases" when a version tag like v1.0.0 is pushed.

name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Read version
        id: ver
        run: |
          $v = python -c "import app; print(app.APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          $notes = (git log -1 --pretty=%s) -replace '^v[0-9.]+:\s*', ''
          "notes=$notes" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Unit tests
        run: |
          python -m pytest -q -rA 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }

      - name: Lyrics matching check (timing info only)
        continue-on-error: true
        run: |
          python tools/check_song.py "birdbrain" "Jamie Paige" 245 2>&1 | Tee-Object -FilePath lyrics-check.txt
          $global:LASTEXITCODE = 0

      - name: Can posts on X be shown in Song meanings (info only)
        continue-on-error: true
        run: |
          python -c "from app.meanings import fetch_x_post; import json; [print(json.dumps(fetch_x_post(u), ensure_ascii=False)) for u in ('https://x.com/jack/status/20', 'https://x.com/TheEllenShow/status/440322224407314432')]" 2>&1 | Tee-Object -FilePath ci-x-check.txt
          $global:LASTEXITCODE = 0

      - name: Self-test from source (on Windows)
        run: |
          python main.py --self-test --report selftest-source.txt
          Get-Content selftest-source.txt
          if (-not (Select-String -Path selftest-source.txt -SimpleMatch "Windows media integration loaded")) { throw "winrt failed from source" }
          # a temporary lyrics-server hiccup shouldn't fail the whole build
          $global:LASTEXITCODE = 0

      - name: Build .exe with PyInstaller
        run: pyinstaller SpotifyLyricsOverlay.spec --noconfirm --clean

      - name: Smoke test the built .exe (self-test)
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--self-test","--report","$PWD\selftest-exe.txt" -Wait -PassThru
          Get-Content selftest-exe.txt
          foreach ($needle in "PySide6", "Windows media integration loaded", "click-through / always-on-top helpers loaded", "Album art reader works", "Japanese romaji available") {
            if (-not (Select-String -Path selftest-exe.txt -SimpleMatch $needle | Where-Object { $_.Line -like "✔*" })) {
              throw "Packaged app check failed: $needle"
            }
          }

      - name: Smoke test the built .exe (demo overlay screenshot)
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--demo","--screenshot","$PWD\demo-overlay.png","--quit-after","7" -Wait -PassThru
          if (-not (Test-Path demo-overlay.png)) {
            Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -ErrorAction SilentlyContinue
            throw "Overlay did not render"
          }
          if ($p.ExitCode -ne 0) { throw "App exited with code $($p.ExitCode)" }
          Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -ErrorAction SilentlyContinue

      - name: Feature screenshots (themes, album art, timer, translation)
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $cfg = "$env:APPDATA\SpotifyLyricsOverlay\settings.json"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          $before = (Get-ItemProperty -Path $key -Name EnableTransparency -ErrorAction SilentlyContinue).EnableTransparency
          "Windows: $([System.Environment]::OSVersion.VersionString) | Transparency effects before: $before" | Tee-Object -FilePath ci-glass-info.txt
          # the test runs below: frosted with transparency OFF (should fall back) and ON (should blur)
          $shots = [ordered]@{
            "design-classic" = @{ song = "1";  at = 6; grab = $false; s = @{ design = "classic"; show_album_art = $true; time_display = "left"; show_progress = $true } }
            "design-aurora"  = @{ song = "jp"; at = 6; grab = $false; s = @{ design = "aurora"; show_album_art = $true; time_display = "left"; show_progress = $true; translate_enabled = $true } }
            "design-hud"     = @{ song = "1";  at = 6; grab = $false; s = @{ design = "hud"; show_album_art = $false; time_display = "elapsed"; show_progress = $true } }
            "ai-listening"   = @{ song = "1";  at = 6; grab = $false; extra = @("--ai-note","AI_listening","--ai-progress","0.42"); s = @{ design = "classic"; show_album_art = $true; time_display = "left"; ai_sync_enabled = $true } }
            "ai-spotify"     = @{ song = "1";  at = 6; grab = $false; extra = @("--ai-note","AI_syncing","--ai-progress","0.63"); s = @{ design = "spotify"; show_album_art = $true; time_display = "left"; ai_sync_enabled = $true } }
            "ai-hud"         = @{ song = "1";  at = 6; grab = $false; extra = @("--ai-note","AI_syncing","--ai-progress","0.8"); s = @{ design = "hud"; show_album_art = $false; time_display = "left"; ai_sync_enabled = $true } }
            "design-spotify" = @{ song = "jp"; at = 6; grab = $false; s = @{ design = "spotify"; show_album_art = $true; time_display = "left"; show_progress = $true; match_album_highlight = $true } }
          }
          foreach ($name in $shots.Keys) {
            $conf = $shots[$name].s
            $conf["first_run"] = $false
            $conf | ConvertTo-Json | Set-Content -Encoding utf8 $cfg
            if ($shots[$name].ContainsKey("transp")) {
              New-Item -Path $key -Force -ErrorAction SilentlyContinue | Out-Null
              Set-ItemProperty -Path $key -Name EnableTransparency -Value $shots[$name].transp -Type DWord
              Start-Sleep -Seconds 2
              "$name : EnableTransparency=$((Get-ItemProperty -Path $key).EnableTransparency)" | Tee-Object -FilePath ci-glass-info.txt -Append
            }
            $argv = @("--demo","--demo-song",$shots[$name].song,"--demo-start",$shots[$name].at,"--screenshot","$PWD\demo-overlay-$name.png","--quit-after","5")
            if ($shots[$name].ContainsKey("extra")) { $argv += $shots[$name].extra }
            if ($shots[$name].grab) { $argv += @("--test-backdrop","--screen-grab","$PWD\demo-overlay-$name-screen.png") }
            Start-Process $exe -ArgumentList $argv -Wait
            if (-not (Test-Path "demo-overlay-$name.png")) {
              Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 40 -ErrorAction SilentlyContinue
              throw "No screenshot for $name"
            }
          }
          Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 20 -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\SpotifyLyricsOverlay\app.log" ci-app-log.txt -ErrorAction SilentlyContinue

      - name: Test the "sync this song myself" window with real key presses
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $mine = "$env:APPDATA\SpotifyLyricsOverlay\my_lyrics"
          Remove-Item "$mine\*.lrc" -ErrorAction SilentlyContinue
          $p = Start-Process $exe -ArgumentList "--demo","--demo-start","1","--test-tap","$PWD\demo-overlay-tap-window.png","--screenshot","$PWD\demo-overlay-after-tap.png","--quit-after","6.5" -PassThru
          $null = $p.WaitForExit(60000)
          $file = Get-ChildItem "$mine\*.lrc" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $file) { Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 30; throw "tap-along did not save a lyrics file" }
          "saved: $($file.Name)" | Tee-Object -FilePath ci-tap-check.txt
          Get-Content $file.FullName | Tee-Object -FilePath ci-tap-check.txt -Append
          if (-not (Test-Path demo-overlay-tap-window.png)) { throw "no picture of the sync window" }

      - name: Frame rhythm - how evenly the lyrics are drawn (normal vs precise timer)
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--demo","--demo-start","4","--frame-test","$PWD\ci-frame-test.json" -PassThru
          if (-not $p.WaitForExit(60000)) { Stop-Process $p -Force; throw "frame test hung" }
          if (-not (Test-Path ci-frame-test.json)) { Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 30; throw "no frame report" }
          Get-Content ci-frame-test.json
          $fr = Get-Content ci-frame-test.json -Raw | ConvertFrom-Json
          if ($fr.paint_errors.Count -gt 0) { throw "drawing errors: $($fr.paint_errors -join '; ')" }
          Get-Content ci-frame-test-report.md
          if (Select-String -Path ci-frame-test-report.md -Pattern "couldn't collect" -Quiet) { throw "a problem-report section failed" }
          if (-not ($fr.report_files -contains "overlay.png")) { throw "problem report has no overlay picture" }

      - name: Pictures of the Settings window and a pop-up
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          foreach ($what in "settings", "toast", "history", "meanings", "meanings-large", "meanings-search", "synced", "reset", "fullscreen", "aiwindow") {
            $wait = if ($what -eq "meanings-search") { "8.5" } elseif ($what -like "meanings*") { "6" } else { "4.5" }
            $p = Start-Process $exe -ArgumentList "--demo","--demo-start","6","--ui-shot",$what,"$PWD\demo-overlay-ui-$what.png","--quit-after",$wait -PassThru
            $null = $p.WaitForExit(60000)
            if (-not (Test-Path "demo-overlay-ui-$what.png")) { Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 30; throw "no picture of $what" }
          }

      - name: AI sync end-to-end test (downloads the Light model, hears a test song)
        timeout-minutes: 25
        run: |
          $dir = "$env:RUNNER_TEMP\aitest"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $lines = python -c "import sys; sys.path.insert(0,'tools'); import make_ai_test_song as m; print(chr(10).join(m.LINES))"
          $i = 0
          foreach ($line in ($lines -split "`n")) {
            if (-not $line.Trim()) { continue }
            $voice.SetOutputToWaveFile("$dir\line$i.wav", $fmt); $voice.Speak($line.Trim()); $voice.SetOutputToNull(); $i++
          }
          python tools/make_ai_test_song.py $dir
          Copy-Item "$dir\test.wav" ci-ai-test-song.wav
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--ai-test","light","$dir\test.wav","$dir\truth.lrc","$PWD\ci-ai-report.json","--ai-store","$env:RUNNER_TEMP\aimodels" -PassThru
          if (-not $p.WaitForExit(1200000)) { Stop-Process $p -Force; throw "AI test took too long" }
          Get-Content ci-ai-report.json
          Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 15
          $r = Get-Content ci-ai-report.json -Raw | ConvertFrom-Json
          if (-not $r.ok) { throw "AI sync test failed" }
          "Download: $($r.download_s) s, $($r.size_mb) MB. Hearing the song: $($r.hear_s) s. Matched $($r.matched)/$($r.lines) lines, worst error $($r.max_error) s"

      - name: AI sync accuracy - hard song, normal vs second listen vs vocal separation
        timeout-minutes: 30
        run: |
          $dir = "$env:RUNNER_TEMP\aitest"
          Add-Type -AssemblyName System.Speech
          $voice = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $fmt = New-Object System.Speech.AudioFormat.SpeechAudioFormatInfo(16000, [System.Speech.AudioFormat.AudioBitsPerSample]::Sixteen, [System.Speech.AudioFormat.AudioChannel]::Mono)
          $lines = python -c "import sys; sys.path.insert(0,'tools'); import make_ai_test_song as m; print(chr(10).join(m.HARD_LINES))"
          $i = 0
          foreach ($line in ($lines -split "`n")) {
            if (-not $line.Trim()) { continue }
            $voice.SetOutputToWaveFile("$dir\hard$i.wav", $fmt); $voice.Speak($line.Trim()); $voice.SetOutputToNull(); $i++
          }
          python tools/make_ai_test_song.py $dir hard
          Copy-Item "$dir\hard.wav" ci-ai-hard-song.wav
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $runs = [ordered]@{ "normal" = ""; "second" = "second"; "vocals" = "vocals"; "both" = "second,vocals"; "patch" = "patch" }
          $summary = @()
          foreach ($name in $runs.Keys) {
            $out = "$PWD\ci-ai-hard-$name.json"
            $t = Measure-Command {
              $argv = @("--ai-test","light","$dir\hard.wav","$dir\hard.lrc",$out,"--ai-store","$env:RUNNER_TEMP\aimodels")
              if ($runs[$name]) { $argv += @("--ai-options",$runs[$name]) }
              $p = Start-Process $exe -ArgumentList $argv -PassThru
              if (-not $p.WaitForExit(900000)) { Stop-Process $p -Force; throw "AI test '$name' took too long" }
            }
            if (-not (Test-Path $out)) { Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 40; throw "no report for '$name' (crashed?)" }
            $r = Get-Content $out -Raw | ConvertFrom-Json
            if ($r.error) { Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 40; throw "AI test '$name' failed: $($r.error)" }
            $summary += "{0,-7} matched {1,2}/{2}  worst {3,5} s  mean {4,5} s  took {5,4:N0} s  {6}" -f $name, $r.matched, $r.lines, $r.max_error, $r.mean_error, $t.TotalSeconds, $r.message
          }
          $summary | Tee-Object -FilePath ci-ai-compare.txt
          Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 12

      - name: AI sync Max model test (only when the commit asks for it)
        if: contains(github.event.head_commit.message, '[max-test]')
        timeout-minutes: 40
        run: |
          $dir = "$env:RUNNER_TEMP\aitest"
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          foreach ($song in "test", "hard") {
            $out = "$PWD\ci-ai-max-$song.json"
            $t = Measure-Command {
              $p = Start-Process $exe -ArgumentList "--ai-test","max","$dir\$song.wav","$dir\$(if ($song -eq 'test') {'truth'} else {'hard'}).lrc",$out,"--ai-store","$env:RUNNER_TEMP\aimodels" -PassThru
              if (-not $p.WaitForExit(2100000)) { Stop-Process $p -Force; throw "Max model test took too long" }
            }
            if (-not (Test-Path $out)) { Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 40; throw "no Max report" }
            $r = Get-Content $out -Raw | ConvertFrom-Json
            if ($r.error) { throw "Max model failed: $($r.error)" }
            "max on $song : matched $($r.matched)/$($r.lines), worst $($r.max_error) s, mean $($r.mean_error) s, download $($r.download_s) s ($($r.size_mb) MB), took $([int]$t.TotalSeconds) s" | Tee-Object -FilePath ci-ai-max.txt -Append
          }

      - name: Can the PC's sound be recorded (needs a sound device - info only)
        continue-on-error: true
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--listen-test","$PWD\ci-listen.json" -PassThru
          $null = $p.WaitForExit(60000)
          if (Test-Path ci-listen.json) { Get-Content ci-listen.json } else { "no report" }

      - name: Listen to one app only (needs a sound device - info only)
        continue-on-error: true
        run: |
          $player = Start-Process powershell -ArgumentList "-NoProfile","-Command","`$p = New-Object System.Media.SoundPlayer '$PWD\ci-ai-test-song.wav'; try { `$p.PlayLooping() } catch { }; Start-Sleep 40" -PassThru -WindowStyle Hidden
          Start-Sleep 3
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--app-audio-probe",$player.Id,"$PWD\ci-app-audio.json" -PassThru
          $done = $p.WaitForExit(30000)
          "probe finished: $done, exit code: $($p.ExitCode)"
          if (Test-Path ci-app-audio.json) { Get-Content ci-app-audio.json } else { "no report (the probe crashed?)" }
          Stop-Process $player -Force -ErrorAction SilentlyContinue

      - name: Build installer (Inno Setup)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (Test-Path "$default\ISCC.exe") { $env:PATH += ";$default" }
            else { choco install innosetup -y --no-progress; $env:PATH += ";$default" }
          }
          iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\installer.iss

      - name: Test silent install and auto-restart (what the in-app updater does)
        timeout-minutes: 6
        run: |
          $setup = Get-ChildItem Output\SpotifyLyricsOverlay-Setup-*.exe | Select-Object -First 1
          $dir = "$env:LOCALAPPDATA\Programs\Spotify Lyrics Overlay"
          Get-Process SpotifyLyricsOverlay -ErrorAction SilentlyContinue | Stop-Process -Force
          # wait for the installer only - not for the overlay it restarts (that keeps running)
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/FORCECLOSEAPPLICATIONS","/RESTARTAPP=1" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "installer did not finish within 3 minutes" }
          "installer exit code: $($p.ExitCode)" | Tee-Object -FilePath ci-update-check.txt
          if (-not (Test-Path "$dir\SpotifyLyricsOverlay.exe")) { throw "silent install did not install the app" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller - in-app update would not be offered" }
          Start-Sleep -Seconds 6
          $running = Get-Process SpotifyLyricsOverlay -ErrorAction SilentlyContinue
          "app restarted after silent install: $([bool]$running)" | Tee-Object -FilePath ci-update-check.txt -Append
          if (-not $running) { throw "app was not restarted after the silent install" }
          $running | Stop-Process -Force
          Start-Sleep -Seconds 1
          $r = Start-Process "$dir\SpotifyLyricsOverlay.exe" -ArgumentList "--self-test","--report","$PWD\selftest-installed.txt" -PassThru
          $null = $r.WaitForExit(120000)
          Get-Content selftest-installed.txt | Tee-Object -FilePath ci-update-check.txt -Append

      - name: Test the updater against the real GitHub releases page
        continue-on-error: true
        run: |
          python -c "from app import updater as U; i=U.check_latest('0.0.1'); print('latest release:', i.version, '| installer:', i.installer_name, '| size:', i.size, '| sha256 provided:', bool(i.sha256)); p=U.download(i); print('downloaded + verified:', p.name, p.stat().st_size, 'bytes'); print('up to date check for 999.0:', U.check_latest('999.0'))" 2>&1 | Tee-Object -FilePath ci-update-check.txt -Append
          $global:LASTEXITCODE = 0

      - name: Portable zip
        run: Compress-Archive -Path dist\SpotifyLyricsOverlay\* -DestinationPath "Output\SpotifyLyricsOverlay-Portable-${{ steps.ver.outputs.version }}.zip"

      - name: Upload installer + portable
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyLyricsOverlay-Windows-${{ steps.ver.outputs.version }}
          path: Output/*

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            selftest-*.txt
            demo-overlay*.png

      - name: Publish build diagnostics (readable without logging in)
        if: always() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-diagnostics
          name: CI diagnostics (latest build - not a download)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: Test output from the most recent build. For troubleshooting only - get the app from the latest normal release.
          files: |
            pytest-output.txt
            selftest-*.txt
            lyrics-check.txt
            ci-app-log.txt
            ci-glass-info.txt
            ci-update-check.txt
            ci-tap-check.txt
            ci-ai-report.json
            ci-listen.json
            ci-app-audio.json
            ci-x-check.txt
            ci-ai-compare.txt
            ci-frame-test.json
            ci-frame-test-spotify.png
            ci-frame-test-report.md
            ci-ai-hard-*.json
            ci-ai-max.txt
            ci-ai-max-*.json
            ci-ai-hard-song.wav
            ci-ai-hard-vocals.vocals.wav
            ci-ai-test-song.wav
            demo-overlay-*-screen.png
          fail_on_unmatched_files: false
          overwrite_files: true

      - name: Publish GitHub Release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !contains(github.event.head_commit.message, '[no-release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Spotify Lyrics Overlay ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Output/*
            selftest-exe.txt
            demo-overlay*.png
          body: |
            What's new: ${{ steps.ver.outputs.notes }}

            **Already have version 1.9.0 or newer?** The app updates itself: right-click the tray icon → Update.

            **Download `SpotifyLyricsOverlay-Setup-${{ steps.ver.outputs.version }}.exe`** and double-click it.
            If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn't paid-signed).
            Prefer no installer? Download the Portable zip, extract it, and run `SpotifyLyricsOverlay.exe`.
            See the README for usage and keyboard shortcuts.
