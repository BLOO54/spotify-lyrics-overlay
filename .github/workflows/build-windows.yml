# Builds the Windows app on a real Windows machine provided by GitHub, tests it,
# and produces:  SpotifyLyricsOverlay-Setup-<version>.exe  (installer)
#                SpotifyLyricsOverlay-Portable-<version>.zip (no install needed)
# Download them from the "Actions" tab -> latest run -> "Artifacts",
# or from "Releases" when a version tag like v1.0.0 is pushed.

name: Build Windows app

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pytest

      - name: Read version
        id: ver
        run: |
          $v = python -c "import app; print(app.APP_VERSION)"
          "version=$v" >> $env:GITHUB_OUTPUT
          $notes = (git log -1 --pretty=%s) -replace '^v[0-9.]+:\s*', ''
          "notes=$notes" >> $env:GITHUB_OUTPUT
          Write-Host "Version $v"

      - name: Unit tests
        run: |
          python -m pytest -q -rA 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { throw "Unit tests failed" }

      - name: Lyrics matching check (timing info only)
        continue-on-error: true
        run: |
          python tools/check_song.py "birdbrain" "Jamie Paige" 245 2>&1 | Tee-Object -FilePath lyrics-check.txt
          $global:LASTEXITCODE = 0

      - name: Self-test from source (on Windows)
        run: |
          python main.py --self-test --report selftest-source.txt
          Get-Content selftest-source.txt
          if (-not (Select-String -Path selftest-source.txt -SimpleMatch "Windows media integration loaded")) { throw "winrt failed from source" }
          # a temporary lyrics-server hiccup shouldn't fail the whole build
          $global:LASTEXITCODE = 0

      - name: Build .exe with PyInstaller
        run: pyinstaller SpotifyLyricsOverlay.spec --noconfirm --clean

      - name: Smoke test the built .exe (self-test)
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--self-test","--report","$PWD\selftest-exe.txt" -Wait -PassThru
          Get-Content selftest-exe.txt
          foreach ($needle in "PySide6", "Windows media integration loaded", "click-through / always-on-top helpers loaded", "Album art reader works", "Japanese romaji available") {
            if (-not (Select-String -Path selftest-exe.txt -SimpleMatch $needle | Where-Object { $_.Line -like "✔*" })) {
              throw "Packaged app check failed: $needle"
            }
          }

      - name: Smoke test the built .exe (demo overlay screenshot)
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $p = Start-Process $exe -ArgumentList "--demo","--screenshot","$PWD\demo-overlay.png","--quit-after","7" -Wait -PassThru
          if (-not (Test-Path demo-overlay.png)) {
            Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -ErrorAction SilentlyContinue
            throw "Overlay did not render"
          }
          if ($p.ExitCode -ne 0) { throw "App exited with code $($p.ExitCode)" }
          Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -ErrorAction SilentlyContinue

      - name: Feature screenshots (themes, album art, timer, translation)
        run: |
          $exe = "dist\SpotifyLyricsOverlay\SpotifyLyricsOverlay.exe"
          $cfg = "$env:APPDATA\SpotifyLyricsOverlay\settings.json"
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Themes\Personalize"
          $before = (Get-ItemProperty -Path $key -Name EnableTransparency -ErrorAction SilentlyContinue).EnableTransparency
          "Windows: $([System.Environment]::OSVersion.VersionString) | Transparency effects before: $before" | Tee-Object -FilePath ci-glass-info.txt
          # the test runs below: frosted with transparency OFF (should fall back) and ON (should blur)
          $shots = [ordered]@{
            "sanity" = @{ song = "1"; at = 6; grab = $false; s = @{ theme = "Neon"; show_album_art = $true; time_display = "left" } }
          }
          foreach ($name in $shots.Keys) {
            $conf = $shots[$name].s
            $conf["first_run"] = $false
            $conf | ConvertTo-Json | Set-Content -Encoding utf8 $cfg
            if ($shots[$name].ContainsKey("transp")) {
              New-Item -Path $key -Force -ErrorAction SilentlyContinue | Out-Null
              Set-ItemProperty -Path $key -Name EnableTransparency -Value $shots[$name].transp -Type DWord
              Start-Sleep -Seconds 2
              "$name : EnableTransparency=$((Get-ItemProperty -Path $key).EnableTransparency)" | Tee-Object -FilePath ci-glass-info.txt -Append
            }
            $argv = @("--demo","--demo-song",$shots[$name].song,"--demo-start",$shots[$name].at,"--screenshot","$PWD\demo-overlay-$name.png","--quit-after","5")
            if ($shots[$name].grab) { $argv += @("--test-backdrop","--screen-grab","$PWD\demo-overlay-$name-screen.png") }
            Start-Process $exe -ArgumentList $argv -Wait
            if (-not (Test-Path "demo-overlay-$name.png")) {
              Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 40 -ErrorAction SilentlyContinue
              throw "No screenshot for $name"
            }
          }
          Get-Content "$env:APPDATA\SpotifyLyricsOverlay\app.log" -Tail 20 -ErrorAction SilentlyContinue
          Copy-Item "$env:APPDATA\SpotifyLyricsOverlay\app.log" ci-app-log.txt -ErrorAction SilentlyContinue

      - name: Build installer (Inno Setup)
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $default = "${env:ProgramFiles(x86)}\Inno Setup 6"
            if (Test-Path "$default\ISCC.exe") { $env:PATH += ";$default" }
            else { choco install innosetup -y --no-progress; $env:PATH += ";$default" }
          }
          iscc /DMyAppVersion=${{ steps.ver.outputs.version }} installer\installer.iss

      - name: Test silent install and auto-restart (what the in-app updater does)
        timeout-minutes: 6
        run: |
          $setup = Get-ChildItem Output\SpotifyLyricsOverlay-Setup-*.exe | Select-Object -First 1
          $dir = "$env:LOCALAPPDATA\Programs\Spotify Lyrics Overlay"
          Get-Process SpotifyLyricsOverlay -ErrorAction SilentlyContinue | Stop-Process -Force
          # wait for the installer only - not for the overlay it restarts (that keeps running)
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/CLOSEAPPLICATIONS","/FORCECLOSEAPPLICATIONS","/RESTARTAPP=1" -PassThru
          if (-not $p.WaitForExit(180000)) { throw "installer did not finish within 3 minutes" }
          "installer exit code: $($p.ExitCode)" | Tee-Object -FilePath ci-update-check.txt
          if (-not (Test-Path "$dir\SpotifyLyricsOverlay.exe")) { throw "silent install did not install the app" }
          if (-not (Test-Path "$dir\unins000.exe")) { throw "no uninstaller - in-app update would not be offered" }
          Start-Sleep -Seconds 6
          $running = Get-Process SpotifyLyricsOverlay -ErrorAction SilentlyContinue
          "app restarted after silent install: $([bool]$running)" | Tee-Object -FilePath ci-update-check.txt -Append
          if (-not $running) { throw "app was not restarted after the silent install" }
          $running | Stop-Process -Force
          Start-Sleep -Seconds 1
          $r = Start-Process "$dir\SpotifyLyricsOverlay.exe" -ArgumentList "--self-test","--report","$PWD\selftest-installed.txt" -PassThru
          $null = $r.WaitForExit(120000)
          Get-Content selftest-installed.txt | Tee-Object -FilePath ci-update-check.txt -Append

      - name: Test the updater against the real GitHub releases page
        continue-on-error: true
        run: |
          python -c "from app import updater as U; i=U.check_latest('0.0.1'); print('latest release:', i.version, '| installer:', i.installer_name, '| size:', i.size, '| sha256 provided:', bool(i.sha256)); p=U.download(i); print('downloaded + verified:', p.name, p.stat().st_size, 'bytes'); print('up to date check for 999.0:', U.check_latest('999.0'))" 2>&1 | Tee-Object -FilePath ci-update-check.txt -Append
          $global:LASTEXITCODE = 0

      - name: Portable zip
        run: Compress-Archive -Path dist\SpotifyLyricsOverlay\* -DestinationPath "Output\SpotifyLyricsOverlay-Portable-${{ steps.ver.outputs.version }}.zip"

      - name: Upload installer + portable
        uses: actions/upload-artifact@v4
        with:
          name: SpotifyLyricsOverlay-Windows-${{ steps.ver.outputs.version }}
          path: Output/*

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            selftest-*.txt
            demo-overlay*.png

      - name: Publish build diagnostics (readable without logging in)
        if: always() && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-diagnostics
          name: CI diagnostics (latest build - not a download)
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: Test output from the most recent build. For troubleshooting only - get the app from the latest normal release.
          files: |
            pytest-output.txt
            selftest-*.txt
            lyrics-check.txt
            ci-app-log.txt
            ci-glass-info.txt
            ci-update-check.txt
            demo-overlay-*-screen.png
          fail_on_unmatched_files: false
          overwrite_files: true

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Spotify Lyrics Overlay ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            Output/*
            selftest-exe.txt
            demo-overlay*.png
          body: |
            What's new: ${{ steps.ver.outputs.notes }}

            **Already have version 1.9.0 or newer?** The app updates itself: right-click the tray icon → Update.

            **Download `SpotifyLyricsOverlay-Setup-${{ steps.ver.outputs.version }}.exe`** and double-click it.
            If Windows says "Windows protected your PC", click **More info → Run anyway** (the app isn't paid-signed).
            Prefer no installer? Download the Portable zip, extract it, and run `SpotifyLyricsOverlay.exe`.
            See the README for usage and keyboard shortcuts.
